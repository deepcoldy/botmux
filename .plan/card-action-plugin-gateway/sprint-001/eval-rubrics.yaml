rubrics:
  - id: R-1
    description: "类型检查、构建和 diff whitespace 校验通过"
    points: 8
    verification: "node_modules/.bin/tsc --noEmit && bun run build && git diff --check"
  - id: R-2
    description: "Botmux 通用实现、测试与设计文档不存在 Happy Cloud 专用 action、表单或业务分支"
    points: 6
    verification: "人工结合 rg 核对 src/core/plugins/card-actions、daemon/card action 接线、目标测试和新设计文档；任何接入方专用常量直接计 0 并触发 EC-6"
  - id: R-3
    description: "插件作者文档完整覆盖 exact/prefix 注册与优先级、协议、鉴权、启停、多 Bot、慢响应、业务幂等和安全日志"
    points: 6
    verification: "人工核对 docs/design/2026-09-02-card-action-plugin-gateway.md 与实际源码字段、常量和错误语义一致"

exit_criteria:
  - id: EC-1
    description: "scenarios 中所有 must_pass=true 项 verification 通过"
  - id: EC-2
    description: "主流用户链路通过可执行 mock HTTP plugin service 完成真实 loopback POST 与 ACK，不以 mock fetch 代替"
  - id: EC-3
    description: "现有 Botmux 内建卡片 fallback、2.5 秒 ACK、event_id 去重和 late patch 测试无回归"
  - id: EC-4
    description: "tsc --noEmit、bun run build 和 git diff --check 均成功"
  - id: EC-5
    description: "token 为 per-plugin 私有能力，loopback-only 且不出现在公共文件、URL、日志或跨插件请求中"
  - id: EC-6
    description: "Botmux 核心没有 Happy Cloud 专用代码；src/features/happy-cloud/card-action.ts 和进程内业务 registry 已移除"
  - id: EC-7
    description: "反虚假完成自检无命中，generator 未写测试且 evaluator 未写业务源码"

total_points: 100

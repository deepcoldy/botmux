name: Sandbox network boundary

on:
  pull_request:
    paths:
      - '.github/workflows/sandbox-network.yml'
      - 'src/core/sandbox-network-*'
      - 'src/core/linux-isolation.ts'
      - 'src/core/self-spawn.ts'
      - 'src/sandbox-network-runner.ts'
      - 'src/adapters/backend/sandbox.ts'
      - 'src/adapters/cli/fs-policy.ts'
      - 'src/cli.ts'
      - 'src/worker.ts'
      - 'src/core/worker-pool.ts'
      - 'src/daemon.ts'
      - 'src/services/**'
      - 'src/workflows/**'
      - 'src/types.ts'
      - 'test/sandbox-network-*'

permissions:
  contents: read

concurrency:
  group: sandbox-network-${{ github.ref }}
  cancel-in-progress: true

env:
  # No job runs the Electron binary that electron's postinstall downloads (the
  # desktop release lets electron-builder fetch its own copy), and that download
  # has no retry: one 504 fails the whole bun install (#3193).
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  network-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.4
      - name: Install kernel test tools
        run: |
          # Fail partial index updates rather than silently using stale indexes.
          node scripts/ci-net-retry.mjs sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o APT::Update::Error-Mode=any update
          node scripts/ci-net-retry.mjs sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y bubblewrap nftables slirp4netns iproute2
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: node scripts/ci-net-retry.mjs bun install --frozen-lockfile
      - run: bun run build
      - name: Build the real single-file entry
        run: bun scripts/build-bun-binary.mjs --target bun-linux-x64 --out "$RUNNER_TEMP/botmux-network-test"
      - name: Enforce IPv4, IPv6, PTY and binary boundaries
        env:
          BOTMUX_NETWORK_POLICY_INTEGRATION: '1'
        run: |
          export BOTMUX_NETWORK_TEST_BINARY="$RUNNER_TEMP/botmux-network-test"
          # All fixture addresses and firewall rules belong to this NEW outer
          # namespace. No host firewall changes or real provider requests.
          unshare -Urn sh -c '
            set -eu
            ip link set lo up
            ip addr add 93.184.216.34/32 dev lo
            ip addr add 10.77.0.1/32 dev lo
            ip addr add 10.0.2.3/32 dev lo
            ip -6 addr add 2606:4700::100/128 dev lo nodad
            ip -6 addr add fd55::1/128 dev lo nodad
            bun run test test/sandbox-network-linux.test.ts
          '
